<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>每日研判看板</title>
<style>
/* 护眼深色 (李老师偏好): 低对比不刺眼, 大字号, 窄行高舒适 */
:root{
  --bg:#1c2128; --card:#232a33; --card2:#2a323d; --line:#39434f;
  --tx:#d8dee6; --dim:#93a0ad; --green:#5fbf8a; --red:#e07b6c;
  --amber:#d9b36a; --blue:#6fa8d9;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
  font:15px/1.7 "Microsoft YaHei","PingFang SC",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 40px}
h1{font-size:22px;margin:6px 0 2px;font-weight:600}
.topbar{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;
  padding:10px 14px;background:var(--card);border:1px solid var(--line);
  border-radius:8px;margin-bottom:14px}
.topbar .ts{color:var(--dim);font-size:13px}
.src{font-size:13px;color:var(--dim)}
.warn{background:#3a3423;border:1px solid var(--amber);color:var(--amber);
  padding:8px 12px;border-radius:8px;margin:10px 0;font-size:14px}
.tabs{display:flex;gap:6px;margin:14px 0 0;border-bottom:1px solid var(--line)}
.tab{padding:9px 22px;cursor:pointer;border-radius:8px 8px 0 0;color:var(--dim);
  font-size:16px;user-select:none}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--card);color:var(--tx);border:1px solid var(--line);border-bottom:none}
.pane{display:none;padding-top:12px}
.pane.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;
  padding:14px 16px;margin-bottom:14px}
.card h2{font-size:17px;margin:0 0 10px;color:var(--blue)}
.card h3{font-size:15px;margin:14px 0 6px;color:var(--dim);font-weight:600}
details{background:var(--card2);border:1px solid var(--line);border-radius:8px;
  padding:8px 14px;margin-bottom:10px}
details summary{cursor:pointer;font-size:15px;font-weight:600;padding:4px 0}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--card2);color:var(--dim);font-weight:600;padding:7px 10px;
  border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap;user-select:none}
th:hover{color:var(--tx)}
td{padding:6px 10px;border-bottom:1px solid #2d3540;vertical-align:top}
tr:hover td{background:#2a333f}
.L{color:var(--green)} .S{color:var(--red)} .N{color:var(--dim)}
.big{font-size:26px;font-weight:700}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px;
  background:var(--card2);border:1px solid var(--line);margin:2px 4px 2px 0}
.chip.good{border-color:var(--green);color:var(--green)}
.chip.bad{border-color:var(--red);color:var(--red)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.statbox{background:var(--card2);border:1px solid var(--line);border-radius:8px;
  padding:10px 14px;text-align:center}
.statbox .k{color:var(--dim);font-size:13px}
.small{color:var(--dim);font-size:12.5px}
/* K线展开面板 */
.krow td{padding:0!important;border:none!important}
.kpanel{display:none;padding:12px 14px;background:var(--card2);
  border-top:1px solid var(--line)}
.kpanel.open{display:block}
.kgrid{display:grid;grid-template-columns:minmax(280px,62%) 1fr;gap:14px}
@media(max-width:760px){.kgrid{grid-template-columns:1fr}}
.kcwrap{background:#181c22;border:1px solid var(--line);border-radius:6px;padding:8px}
canvas.kc{width:100%;height:230px;display:block}
canvas.rsic{width:100%;height:70px;display:block;margin-top:6px}
.kleg{font-size:13px;color:var(--dim);margin-top:6px}
.depth h3{margin:6px 0 4px}
.drow{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.dtag{background:var(--card2);border:1px solid var(--line);border-radius:6px;
  padding:5px 10px;font-size:13px}
.dtag b{font-weight:600}
.lv{color:var(--amber)} .res{color:var(--red)} .sup{color:var(--green)}
/* 波段/日内 切换 */
.modebtn{padding:6px 16px;border-radius:16px;cursor:pointer;font-size:14px;
  background:var(--card2);border:1px solid var(--line);color:var(--dim);user-select:none}
.modebtn.on{background:var(--blue);color:#0e1116;border-color:var(--blue);font-weight:600}
.modewrap{display:inline-flex;gap:6px;align-items:center;margin-left:8px}
</style>
</head>

  p.appendChild(secCard(sk[0],sk[1]));
  panesEl.appendChild(p);
});

function secCard(sk,label){
  var s=D.secs[sk]||{},items=s.items||[];
  var c=document.createElement('div');c.className='card';
  var head='<h2>'+label+' — '+items.length+' 个品种 '
    +(s.beijing?'(北京时间 '+esc(s.beijing)+')':'(未生成)')+'</h2>';
  var d=document.createElement('details');
  d.innerHTML='<summary>展开盘口分析</summary><div class="small">'
    +(items.length
      ? '本盘 '+items.length+' 个品种完成扫描: '
        +items.filter(function(x){return x.status==='ok';}).length+' 正常'
        +' / '+items.filter(function(x){return x.status!=='ok';}).length+' 异常'
      : '暂无数据')
    +'</div></details>';
  var wrap=document.createElement('div');wrap.className='tblwrap';
  var tb=document.createElement('table');tb.id='tbl_'+sk;
  tb.innerHTML='<thead><tr>'
    +['品种','层级','现价','方向预判','置信度','H4 ADX','M30动量','目标','止损','图形形态','理由']
    .map(function(h){return '<th title="点击排序">'+h+'</th>';}).join('')
    +'</tr></thead><tbody></tbody>';
  wrap.appendChild(tb);
  var body=tb.tBodies[0];
  items.slice().sort(function(a,b){return (a.tier||'')>(b.tier||'')?1:-1;}).forEach(function(it,idx){
    var tr=document.createElement('tr');
    tr.style.cursor='pointer';
    tr.title='点击展开 K 线深度分析';
    var hasK = it.kline && it.kline.bars && it.kline.bars.length>0;
    tr.innerHTML='<td><b>'+esc(it.sym||'—')+'</b> '
      +(hasK?'<span class="small" style="color:var(--blue)">⊕</span>':'')+'</td>'
      +'<td>'+esc(it.tier||'—')+'</td>'
      +'<td>'+fmt(it.price)+'</td>'
      +'<td class="'+cls(it.direction)+'"><b>'+dirCn(it.direction)+'</b></td>'
      +'<td>'+(it.confidence!=null?Math.round(it.confidence*100)+'%':'—')+'</td>'
      +'<td>'+fmt(it.adx_h4,1)+'</td>'
      +'<td>'+fmt(it.mom_m30_24h,2)+'</td>'
      +'<td>'+(Array.isArray(it.target)?it.target.slice(0,2).map(function(x){return fmt(x);}).join(' / '):(it.target?fmt(it.target):'—'))+'</td>'
      +'<td>'+fmt(it.stop)+'</td>'
      +'<td>'+esc(it.setup||'—')+'</td>'
      +'<td class="small">'+esc(it.action||'')+'</td>';
    tr.dataset.sym = it.sym || '';
    tr.dataset.ki = idx;
    body.appendChild(tr);
    // K 线展开面板 (紧随品种行)
    var krow = document.createElement('tr');
    krow.className='krow';
    var kcell = document.createElement('td');
    kcell.colSpan=11;
    var panel = document.createElement('div');
    panel.className='kpanel';
    panel.id='kpanel_'+sk+'_'+idx;
    kcell.appendChild(panel);
    krow.appendChild(kcell);
    body.appendChild(krow);
    // 点击展开
    tr.onclick = function(){
      var p = document.getElementById('kpanel_'+sk+'_'+idx);
      var wasOpen = p.classList.contains('open');
      // 先关掉本盘口其它已展开的面板
      Array.prototype.forEach.call(document.querySelectorAll('.kpanel.open'), function(x){
        if(x !== p) x.classList.remove('open');
      });
      if(!wasOpen){
        p.classList.add('open');
        buildKPanel(p, it);
      }
    };
  });
  if(!items.length){
    var tr2=document.createElement('tr');
    tr2.innerHTML='<td colspan="11" style="color:var(--dim)">该盘口研判尚未生成 (引擎每 30 分钟自动刷新)</td>';
    body.appendChild(tr2);
  }
  c.innerHTML='';c.insertAdjacentHTML('beforeend',head);
  c.appendChild(d);c.appendChild(wrap);
  return c;
}

/* ---- K 线 + 深度分析 展开面板 (随 MODE: 波段=H1+D1 / 日内=M15+日内结构) ---- */
function buildKPanel(panel, it){
  if(panel.dataset.built) return;  // 幂等
  panel.dataset.built='1';
  var intra = (MODE==='intra');
  var kl = intra ? it.kline_intra : it.kline;
  var dp = (intra ? (it.depth_intra||{}) : (it.depth||{}));
  var dir=it.direction, px=it.price;
  var res=document.createElement('div');
  res.className='kgrid';
  var L=document.createElement('div');
  // Canvas K 线图
  var cw=document.createElement('div');cw.className='kcwrap';
  var cv=document.createElement('canvas');cv.className='kc';cv.width=720;cv.height=230;
  var rv=document.createElement('div');rv.className='kleg';
  if(kl && kl.bars && kl.bars.length>0){
    cw.appendChild(cv);
    // RSI 副图
    var rc=document.createElement('canvas');rc.className='rsic';rc.width=720;rc.height=60;
    cw.appendChild(rc);
    drawKline(cv, kl, dp, dir, px, it.stop);
    if(dp.rsi14!=null) drawRSI(rc, dp.rsi14);
    rv.textContent=(intra?'M15':'H1')+' K线 '+kl.bars.length+' 根 | EMA10/50 | '
      +(intra?'OIB/48h高低':'目标/止损/转折位')+' | RSI='+fmt(dp.rsi14,1);
    L.appendChild(cw); L.appendChild(rv);
  } else {
    L.innerHTML='<div class="small">K 线数据不足</div>';
  }
  // 深度面板
  var R=document.createElement('div');R.className='depth';
  var h2=document.createElement('h3');h2.textContent=it.sym+' — 深度分析 ('+(intra?'日内':'波段')+')';R.appendChild(h2);
  var rows='';
  if(intra){
    // 日内套: OIB 区间 + 48h 高低
    if(dp.oib_hi!=null) rows+='<div class="drow"><span class="dtag"><b>OIB区间</b> '+fmt(dp.oib_lo)+' ~ '+fmt(dp.oib_hi)+'</span></div>';
    var ilv='<div class="drow">'
      +'<span class="dtag res"><b>48h高</b> '+fmt(dp.hi48)+'</span>'
      +'<span class="dtag sup"><b>48h低</b> '+fmt(dp.lo48)+'</span>'
      +'<span class="dtag lv"><b>转折</b> '+fmt(dp.pivot)+'</span>'
      +'</div>';
    if(dp.strategy) rows+='<div class="drow"><span class="dtag" style="grid-column:1/-1"><b>日内策略</b> '+esc(dp.strategy)+'</span></div>';
    if(dp.alt_strategy) rows+='<div class="drow"><span class="dtag" style="grid-column:1/-1"><b>备选</b> '+esc(dp.alt_strategy)+'</span></div>';
    rows+=ilv;
    if(dp.rsi_note) rows+='<div class="small">'+esc(dp.rsi_note)+'</div>';
  } else {
    // 波段套: 中期趋势 + 转折/阻力/支撑
    if(dp.mid_term) rows+='<div class="drow"><span class="dtag"><b>中期</b> '+esc(dp.mid_term)+'</span></div>';
    var lv='<div class="drow">'
      +'<span class="dtag lv"><b>转折</b> '+fmt(dp.pivot)+'</span>'
      +'<span class="dtag res"><b>阻力</b> '+fmt(dp.resistance)+'</span>'
      +'<span class="dtag sup"><b>支撑</b> '+fmt(dp.support)+'</span>'
      +'</div>';
    if(dp.strategy) rows+='<div class="drow"><span class="dtag" style="grid-column:1/-1"><b>策略</b> '+esc(dp.strategy)+'</span></div>';
    if(dp.alt_strategy) rows+='<div class="drow"><span class="dtag" style="grid-column:1/-1"><b>备选</b> '+esc(dp.alt_strategy)+'</span></div>';
    rows+=lv;
    if(dp.rsi_note) rows+='<div class="small">'+esc(dp.rsi_note)+'</div>';
  }
  R.innerHTML=rows;
  res.appendChild(L);res.appendChild(R);
  panel.innerHTML='';panel.appendChild(res);
}

/* ---- Canvas K 线绘制 ---- */
function drawKline(cv, kl, dp, dir, px, stop){
  var ctx=cv.getContext('2d');
  var W=cv.width, H=cv.height;
  var bars=kl.bars, n=bars.length;
  var pad=30, plotW=W-pad-8, plotH=H-20;
  var allP=[];
  bars.forEach(function(b){allP.push(b[1],b[2],b[3]);});
  if(dp.resistance)allP.push(dp.resistance);
  if(dp.support)allP.push(dp.support);
  if(dp.pivot)allP.push(dp.pivot);
  var mn=Math.min.apply(null,allP), mx=Math.max.apply(null,allP);
  if(mx===mn){mx=mn+1e-6;}
  var rng=mx-mn;
  function y(p){return pad+(1-(p-mn)/rng)*plotH;}
  function x(i){return pad+i*(plotW/n)*0.95+1;}
  // 网格
  ctx.strokeStyle='#2d3540';ctx.lineWidth=0.5;
  for(var g=0;g<5;g++){
    var gy=pad+g*(plotH/4);
    ctx.beginPath();ctx.moveTo(pad,gy);ctx.lineTo(W-8,gy);ctx.stroke();
    ctx.fillStyle='#556';ctx.font='10px monospace';
    ctx.fillText((mx-g*(rng/4)).toPrecision(4), 2, gy+3);
  }
  // 关键价位水平线
  function hline(val,col,label){
    if(val==null)return;
    var ly=y(val);
    ctx.strokeStyle=col;ctx.setLineDash([4,3]);ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(pad,ly);ctx.lineTo(W-8,ly);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=col;ctx.font='11px sans-serif';
    ctx.fillText(label+' '+val.toPrecision(5), W-70, ly-3);
  }
  hline(dp.resistance,'#e07b6c','阻力');
  hline(dp.support,'#5fbf8a','支撑');
  hline(dp.pivot,'#d9b36a','转折');
  if(dir==='LONG'&&stop!=null)hline(stop,'#e07b6c','止损');
  else if(dir==='SHORT'&&stop!=null)hline(stop,'#e07b6c','止损');
  // 蜡烛
  for(var i=0;i<n;i++){
    var b=bars[i], bull=b[3]>=b[0];
    var cx=x(i), bw=Math.max(1, plotW/n*0.7);
    ctx.strokeStyle=bull?'#5fbf8a':'#e07b6c';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(cx,y(b[1]));ctx.lineTo(cx,y(b[2]));ctx.stroke();
    ctx.fillStyle=bull?'#5fbf8a':'#e07b6c';
    var top=y(Math.max(b[0],b[3])), bot=y(Math.min(b[0],b[3]));
    var bh=Math.max(1,bot-top);
    ctx.fillRect(cx-bw/2, top, bw, bh);
  }
  // EMA 线
  function drawEMA(arr,col,lw){
    ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();
    var started=false;
    for(var i=0;i<arr.length;i++){
      if(arr[i]==null)continue;
      var ex=x(i),ey=y(arr[i]);
      if(!started){ctx.moveTo(ex,ey);started=true;}else ctx.lineTo(ex,ey);
    }
    ctx.stroke();
  }
  drawEMA(kl.ema10,'#6fa8d9',1.2);
  drawEMA(kl.ema50,'#d9b36a',1.2);
}
function drawRSI(cv, val){
  var ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
  ctx.fillStyle='#181c22';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#2d3540';ctx.lineWidth=0.5;
  [30,50,70].forEach(function(lv){
    var ly=H*(1-lv/100);
    ctx.beginPath();ctx.moveTo(0,ly);ctx.lineTo(W,ly);ctx.stroke();
    ctx.fillStyle='#556';ctx.font='10px monospace';ctx.fillText(lv, W-18, ly-2);
  });
  var cx=W*(1-val/100), cy=H*(1-val/100);
  ctx.fillStyle=val>=50?'#5fbf8a':'#e07b6c';
  ctx.beginPath();ctx.arc(cx,cy,4,0,7);ctx.fill();
  ctx.fillStyle='#d8dee6';ctx.font='11px sans-serif';
  ctx.fillText('RSI='+val.toFixed(1), 8, 12);
}

/* ---- 表头点击排序 (数值按大小, 文本按字典序, 再点反转) ---- */
function bindSort(tb){
  var ths=tb.tHead.rows[0].cells,dir={};
  Array.prototype.forEach.call(ths,function(th){
    th.onclick=function(){
      var k=th.dataset.k,rows=Array.prototype.slice.call(tb.tBodies[0].rows)
        .filter(function(r){return r.dataset.row;});
      dir[k]=!dir[k]||dir[k]===1?-1:1;  /* 首点升序→降序数值习惯: 首点降序 */
      rows.sort(function(a,b){
        var A=JSON.parse(a.dataset.row)[k],B=JSON.parse(b.dataset.row)[k];
        var nA=A==null?-Infinity:Number(A),nB=B==null?-Infinity:Number(B);
        if(isNaN(nA)||isNaN(nB)){
          var sA=String(A==null?'':A),sB=String(B==null?'':B);
          return sA===sB?0:(sA>sB?dir[k]:-dir[k]);
        }
        return (nA-nB)*dir[k];
      });
      rows.forEach(function(r){tb.tBodies[0].appendChild(r);});
    };
  });
}

/* ---- T4 区 ---- */
(function(){
  var el=document.getElementById('t4');
  var scan=D.t4_scan||[],promo=D.t4_promote||[];
  var s='<div class="small">数据来源: '+(D.t4_src?{asia:'亚盘',euro:'欧盘',us:'美盘'}[D.t4_src]:'')
    +'盘口扫描  扫描 '+scan.length+' 品种, 强信号 '+promo.length+' 个</div>';
  if(promo.length){
    s+='<h3>强信号品种 (晋升 T4 观察池)</h3><div>'+promo.map(function(x){
      return '<span class="chip">'+esc(x)+'</span>';}).join('')+'</div>';
  }
  if(scan.length){
    var top=scan.filter(function(x){return x.promote;})
      .sort(function(a,b){return b.score-a.score;}).slice(0,30);
    if(!top.length)top=scan.slice(0,30);
    var tb='<h3>信号榜 Top '+top.length+'</h3><div class="tblwrap"><table><thead><tr>'
      +['sym|品种','px|现价','score|强度分','mom20|20日动量%','promote|信号'].map(function(h){
        var a=h.split('|');return '<th>'+a[1]+'</th>';}).join('')+'</tr></thead><tbody>';
    top.forEach(function(x){
      tb+='<tr><td><b>'+esc(x.sym)+'</b></td><td>'+fmt(x.px)+'</td>'
        +'<td class="'+(x.score>=1?'L':x.score<=-1?'S':'N')+'">'+fmt(x.score,1)+'</td>'
        +'<td>'+fmt(x.mom20,2)+'%</td>'
        +'<td class="'+(x.promote==='LONG'?'L':x.promote==='SHORT'?'S':'N')+'">'
        +(x.promote?dirCn(x.promote):'—')+'</td></tr>';
    });
    s+=tb+'</tbody></table></div>';
  }
  if(!scan.length&&!promo.length)s+='<div class="small">T4 扫描尚未生成</div>';
  el.innerHTML=s;
})();

/* ---- 反思区 ---- */
(function(){
  var st=D.stats||{},bs=st.by_session||{};
  var wr=function(o){return o&&o.win_rate!=null?Math.round(o.win_rate*100)+'%':'—';};
  var box=function(k,v){return '<div class="statbox"><div class="k">'+k+'</div><div class="big">'+v+'</div></div>';};
  document.getElementById('stats').innerHTML =
    box('总对账数',st.n||0)+box('总胜率',wr(st))
    +box('亚盘胜率',wr(bs.asia)+(bs.asia&&bs.asia.n?' <span class="small">(n='+bs.asia.n+')</span>':''))
    +box('欧盘胜率',wr(bs.euro)+(bs.euro&&bs.euro.n?' <span class="small">(n='+bs.euro.n+')</span>':''))
    +box('美盘胜率',wr(bs.us)+(bs.us&&bs.us.n?' <span class="small">(n='+bs.us.n+')</span>':''));
  var body=document.querySelector('#rtbl tbody');
  var recs=D.records||[];
  if(!recs.length){
    body.innerHTML='<tr><td colspan="9" style="color:var(--dim)">暂无对账记录 (反思账本积累中)</td></tr>';
  }
  recs.forEach(function(r){
    var v=r[8],vc={WIN:'L',LOSS:'S',DIRECTION_HIT:'L',MISS:'N'}[v]||'N';
    var tr=document.createElement('tr');
    tr.innerHTML='<td><b>'+esc(r[0])+'</b></td><td>'+esc(r[1])+'</td><td>'
      +({asia:'亚盘',euro:'欧盘',us:'美盘'}[r[2]]||esc(r[2]))+'</td>'
      +'<td class="'+cls(r[3])+'">'+dirCn(r[3])+'</td>'
      +'<td>'+(r[4]!=null?Math.round(r[4]*100)+'%':'—')+'</td>'
      +'<td class="'+(r[5]>0?'L':r[5]<0?'S':'N')+'">'+fmt(r[5],2)+'%</td>'
      +'<td>'+(r[6]?'✓':'')+'</td><td>'+(r[7]?'✗':'')+'</td>'
      +'<td class="'+vc+'"><span class="chip '+(vc==='L'?'good':vc==='S'?'bad':'')+'">'
      +({WIN:'先触目标',LOSS:'先触止损',DIRECTION_HIT:'方向命中',MISS:'未命中'}[v]||esc(v))
      +'</span></td>';
    body.appendChild(tr);
  });
  if((D.records_total||0)>recs.length)
    document.getElementById('rtbl').insertAdjacentHTML('afterend',
      '<div class="small">显示最近 '+recs.length+' 条 / 累计 '+D.records_total+' 条</div>');
})();
